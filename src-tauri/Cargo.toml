[package]
name = "hand-harmoniser"
version = "0.1.1"
description = "Hands-driven live voice harmoniser"
authors = ["you"]
edition = "2021"

[lib]
name = "hand_harmoniser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
signalsmith-stretch = "0.1.3"
pitch-detection = "0.3"
rtrb = "0.4"
freeverb = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
